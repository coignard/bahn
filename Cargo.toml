[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["René Coignard <contact@renecoignard.com>"]
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
repository = "https://github.com/coignard/bahn"
publish = false

[workspace.dependencies]
bahn = { path = "crates/bahn" }
block2 = "0.6"
cargo_metadata = "0.23"
clap = { version = "4.6", features = ["derive"] }
global-hotkey = "0.9"
icns = { version = "0.5", default-features = false, features = ["pngio"] }
jiff = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false }
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-core-graphics = { version = "0.3", default-features = false }
objc2-event-kit = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
objc2-quartz-core = { version = "0.3", default-features = false }
plist = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skrifa = { version = "0.49", default-features = false, features = ["std"] }
tempfile = "3.27"
tiny-skia = { version = "0.12", default-features = false, features = [
    "std",
    "simd",
    "png-format",
] }

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.dev.package."*"]
opt-level = 3
